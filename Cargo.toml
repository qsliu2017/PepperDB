[package]
name = "pepperdb"
version = "0.0.0"
edition = "2021"
description = "A 1:1 Rust translation of the PostgreSQL backend (src/ under postgres/)."
license = "PostgreSQL"

# PostgreSQL is a server; the crate root is a binary (src/main.rs). We deliberately
# do NOT create src/lib.rs so that the `lib` PostgreSQL subsystem can live at
# src/lib/mod.rs without colliding with an auto-detected library target.
[[bin]]
name = "postgres"
path = "src/main.rs"

[features]
# Debugging-only LWLock statistics gathering (C: #define LWLOCK_STATS).
lwlock_stats = []
# Debugging-only memory context consistency checks (C: #define MEMORY_CONTEXT_CHECKING).
memory_context_checking = []

[profile.dev]
# PostgreSQL's Assert() maps to Rust debug_assert!, which is enabled here.
panic = "unwind"

[profile.release]
# Bring-up: keep symbols/line info for backtraces; assertions still off.
debug = true
panic = "unwind"
incremental = true

[dependencies]
libc = "0.2"
